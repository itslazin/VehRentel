spring.application.name=thrissur-vehicle-rental
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MySQL is the default persistent database. Override credentials with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thrissur_vehicle_rental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/vehicles
app.frontend.origins=${FRONTEND_ORIGINS:http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
# MySQL TLS truststore
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:${user.dir}/aiven-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD}